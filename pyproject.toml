[project]
name = "bookshelf"
version = "1.0.0"
description = "A small single-user reading list (FastAPI + SQLAlchemy + vanilla JS)."
requires-python = ">=3.10"

# Dependencies live in requirements*.txt so the app runs with plain `pip install -r`.
# This file only configures the tooling.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # isort
  "UP",           # pyupgrade
  "B",            # bugbear
  "SIM",          # simplify
  "RUF",          # ruff-specific
  "PT",           # pytest style
  "ANN",          # type annotations
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]  # full-width test characters are intentional

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app", "tests"]
